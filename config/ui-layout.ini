; Developer-tunable panel height ranges, in logical pixels.
; Restart ImageEditor after editing this file.
; Use --panel-default to preview defaults without restoring or saving panel layout.
; maximumHeight=0 means no explicit maximum.
; Invalid ranges are normalized so maximumHeight remains above minimumHeight.

[ColorPanel]
minimumHeight=230
maximumHeight=0

[LayersPanel]
; Keeps the layer controls, one layer row, and footer usable at minimum size.
minimumHeight=240
maximumHeight=0

[PropertiesPanel]
minimumHeight=100
maximumHeight=0

[AdjustmentsPanel]
minimumHeight=220
maximumHeight=0
